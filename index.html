<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Aseel | Personal Portfolio</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<script type='text/javascript' src='https://platform-api.sharethis.com/js/sharethis.js#property=67c58f3df80bb90012167e31&product=sop' async='async'></script>

	<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
	<!-- Particles Background -->
	<div class="particles-container">
		<div id="particles-js"></div>
	</div>

	<!-- Header Section -->
	<header class="header">
		<div class="header-content">
			<h1 style="visibility: hidden; height: 0; margin: 0;">Aseel's Personal Portfolio</h1>
		</div>
	</header>

	<!-- Main Content -->
	<div class="main-container">
		<!-- Profile Card -->
		<div class="profile-card">
			<div class="avatar-container">
				<img src="assets/img/avatar.jpg" alt="Aseel's Profile Picture" class="avatar">
			</div>
			<h1 class="name">Aseel</h1>
			<div class="title">Software engineer</div>
			<p class="bio">
				Debugging a path in this world
			</p>
			<div class="social-links">
				<a href="https://instagram.com/h55q" target="_blank" class="social-link" aria-label="Instagram">
					<i class="fab fa-instagram"></i>
				</a>
				<a href="https://x.com/SyntaxMood" target="_blank" class="social-link" aria-label="X">
					<i class="fab fa-x"></i>
				</a>
				<a href="#" target="_blank" class="social-link" aria-label="GitHub">
					<i class="fab fa-github"></i>
				</a>
				<span class="social-link-wrapper">
					<a href="https://aseel.space/blog/" target="_blank" class="social-link" aria-label="Blog">
						<i class="fas fa-blog"></i>
					</a>
					<span class="badge-dot"></span>
				</span>



			</div>
		</div>

		<!-- Ticker Section (Replaced Quotes Section) -->
		<div class="content-section">
			<h2 class="section-title">Hmm</h2>
			<div class="ticker-container">
				<div class="ticker-track">
					<div class="ticker-item">
						<p class="ticker-text">Temporarily Archived</p>
					</div>
					<div class="ticker-item">
						<p class="ticker-text">Temporarily Archived</p>
					</div>
					<div class="ticker-item">
						<p class="ticker-text">Temporarily Archived</p>
					</div>
				</div>
			</div>

			<div class="info-box">
				<p class="info-box-text"><i class="fas fa-info-circle"></i> This content has been temporarily archived and will be available again shortly.</p>
			</div>
		</div>

		<!-- Contact Form -->
		<div class="content-section">
			<h2 class="section-title">Get In Touch</h2>
			<form onsubmit="sendEmail(event)" class="message-form">
				<div class="form-group">
					<label for="message" class="form-label">Your Message</label>
					<textarea id="message" name="message" placeholder="Don't be shy . ." class="message-input" required></textarea>
				</div>
				<button type="submit" class="send-button">
					<i class="fas fa-paper-plane"></i> Send Message
				</button>
			</form>
		</div>
	</div>

	<!-- Footer -->
	<footer>
		<div class="footer-content">

			<p> Developed by <a href="https://instagram.com/h55q" target="_blank" rel="noopener noreferrer">Aseel</a>
			</p>

		</div>
	</footer>

	<!-- Scripts -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
	<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

	<script src="assets/js/main.js"></script>
</body>

</html>
